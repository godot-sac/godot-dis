# Builds the GDExtension for Windows, Linux and macOS, runs the C++ unit tests everywhere and the Godot (GUT)
# tests on Windows and Linux, then packs addons/dis with all libraries into the release zip and checks it in an
# empty project. A tag vX.Y.Z also makes a draft GitHub release with that zip (docs/release.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_win64.exe.zip
            godot_exe: Godot_v4.7.2-stable_win64_console.exe
          - name: Linux
            # The oldest supported runner, so the library runs on older glibc versions too.
            os: ubuntu-22.04
            platform: linux
            scons_args: ""
            godot_zip: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_exe: Godot_v4.7.2-stable_linux.x86_64
          # macOS is not in the 0.1 scope (untested); the build files support it, see docs/compatibility.md.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools (SCons, Open-DIS oracle)
        run: |
          python -m venv tools/.venv
          if [ "${{ matrix.platform }}" = "windows" ]; then PY=tools/.venv/Scripts/python.exe; else PY=tools/.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --quiet -r tools/requirements.txt

      - name: Build (debug and release)
        run: |
          "$PY" -m SCons -j4 target=template_debug ${{ matrix.scons_args }}
          "$PY" -m SCons -j4 target=template_release ${{ matrix.scons_args }}
          rm -f addons/dis/bin/${{ matrix.platform }}/*.exp addons/dis/bin/${{ matrix.platform }}/*.lib
          ls -la addons/dis/bin/${{ matrix.platform }}

      # The library must export only its entry point, or it breaks other extensions (godot-jsbsim) on Linux.
      - name: Exported symbols (Linux)
        if: matrix.platform == 'linux'
        run: python3 tools/check_exports.py

      - name: C++ unit tests (doctest)
        run: '"$PY" -m SCons tests'

      - name: Download Godot
        if: matrix.godot_zip != ''
        run: |
          Z="${{ matrix.godot_zip }}"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          "$PY" -m zipfile -e godot.zip godot_bin
          chmod +x "godot_bin/${{ matrix.godot_exe }}"
          echo "GODOT=$PWD/godot_bin/${{ matrix.godot_exe }}" >> "$GITHUB_ENV"

      - name: Sample captures and tshark (optional inputs of the interop tests)
        if: matrix.godot_zip != ''
        continue-on-error: true
        run: |
          "$PY" tools/fetch_captures.py
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          fi

      - name: Godot tests (GUT)
        if: matrix.godot_zip != ''
        run: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd
          "$PY" tools/check_first_import.py --godot "$GODOT"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: addons/dis/bin/${{ matrix.platform }}
          if-no-files-found: error

  package:
    name: Addon package
    needs: build
    # The oldest supported runner, like the Linux build, so the check runs where the library is built.
    runs-on: ubuntu-22.04
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Pack addons/dis (all platforms)
        run: |
          for platform in windows linux; do
            mkdir -p "addons/dis/bin/$platform"
            cp -r "artifacts/bin-$platform/." "addons/dis/bin/$platform/"
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 tools/package_addon.py --version "$VERSION" --platforms windows,linux
          python3 -m zipfile -l "build/package/godot-dis-$VERSION.zip"
      - name: Check the package in a new project (Linux)
        run: |
          Z="${GODOT_ZIP}"; R="--retry 5 --retry-all-errors --retry-delay 10"; curl -sSfL $R -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=${Z#Godot_v${GODOT_VERSION}-stable_}" || curl -sSfL $R -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$Z"
          unzip -q godot.zip -d godot_bin
          python3 tools/check_package.py "build/package/godot-dis-$VERSION.zip" --godot "$PWD/godot_bin/${GODOT_ZIP%.zip}"
      - uses: actions/upload-artifact@v4
        with:
          name: godot-dis-${{ env.VERSION }}
          path: build/package/godot-dis-${{ env.VERSION }}.zip
          if-no-files-found: error

  # A tag vX.Y.Z makes a draft GitHub release with the checked zip and the CHANGELOG section as notes; publish it
  # by hand after a look (docs/release.md).
  release:
    name: Draft release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-dis-*
          path: dist
          merge-multiple: true
      - name: Create the release and attach the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls -la dist
          test -f "dist/godot-dis-$VERSION.zip"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "godot-dis $VERSION" --notes-file notes.md
          fi
